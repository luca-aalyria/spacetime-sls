[project]
name = "ngso_sls"
version = "0.0.1"
description = "NGSO constellation coverage/availability simulator (Slice A)"
# 3.11 floor: Debian bookworm hosts ship 3.11; code audited for 3.12-only syntax/stdlib
# (none found) — Colab (3.12) and the sandbox venv (3.14) remain the primary targets.
requires-python = ">=3.11"
dependencies = ["numpy", "astropy", "pandas", "matplotlib", "h3", "plotly", "ipywidgets"]

[project.optional-dependencies]
spacetime = ["grpcio", "protobuf"]   # spacetime-api itself is NOT on PyPI — see notebook install cell
oracle = ["skyfield", "sgp4"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ngso_sls*"]

[tool.setuptools.package-data]
ngso_sls = ["data/*.json"]
"ngso_sls.spacetime" = ["fixtures/*.json"]
